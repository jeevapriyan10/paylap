name: CI

on:
  push:
    branches: [main, product-core]
  pull_request:
    branches: [main, product-core]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Code Formatting
        run: ruff format --check .

  typecheck:
    name: Static Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run Mypy
        run: mypy app

  test:
    name: Test & Coverage (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paylap_owner
          POSTGRES_PASSWORD: paylap_owner_pass
          POSTGRES_DB: paylap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYLAP_ENV: test
      DATABASE_URL: postgresql+psycopg://paylap_owner:paylap_owner_pass@localhost:5432/paylap_test
      DATABASE_URL_MIGRATE: postgresql+psycopg://paylap_owner:paylap_owner_pass@localhost:5432/paylap_test
      PAYLAP_MASTER_KEYS: "key_dev_01:6stxOEtsuSzel79i9d7CIBnhxSTFczA6m+2aTkS1Vao="
      PAYLAP_SECRET_KEY: "test_secret_key_that_is_at_least_32_bytes_long_12345"
      PAYLAP_SIGNUP_MODE: open
      PAYLAP_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PAYLAP_ENABLE_DOCS: "true"
      PAYLAP_ALLOW_LIVE: "false"
      PAYLAP_RUNNER: process
      PAYLAP_JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov openapi-spec-validator

      - name: Run Database Migrations
        run: alembic upgrade head

      - name: Run OpenAPI Spec Export & Validation
        run: python scripts/export_openapi.py

      - name: Run Pytest with Coverage Guard (>= 80%)
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  security:
    name: Security Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST Security Scan
        run: bandit -r app -ll -x tests

      - name: Run pip-audit Dependency Vulnerability Scan
        run: pip-audit -r requirements.txt --ignore-vuln CVE-DUMMY-PASS

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
