services:
  postgres:
    image: postgres:16-alpine
    container_name: paylap_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_1234}
      POSTGRES_DB: paylap
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paylap"]
      interval: 10s
      timeout: 5s
      retries: 5

  paylap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paylap_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYLAP_ENV: production
      DATABASE_URL: postgresql+psycopg://paylap_app:${APP_DB_PASSWORD:-app_pass_secret_1234}@postgres:5432/paylap
      DATABASE_URL_MIGRATE: postgresql+psycopg://paylap_owner:${OWNER_DB_PASSWORD:-owner_pass_secret_1234}@postgres:5432/paylap
      PAYLAP_SECRET_KEY: ${PAYLAP_SECRET_KEY}
      PAYLAP_MASTER_KEYS: ${PAYLAP_MASTER_KEYS}
      PAYLAP_SIGNUP_MODE: ${PAYLAP_SIGNUP_MODE:-closed}
      PAYLAP_ALLOW_LIVE: ${PAYLAP_ALLOW_LIVE:-false}
      PAYLAP_RUNNER: process
      PAYLAP_JOBS_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_prod:
