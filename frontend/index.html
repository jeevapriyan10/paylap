<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayLap API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      max-width: 540px;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
      color: #38bdf8;
    }
    p.tagline {
      font-style: italic;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #065f46;
      color: #6ee7b7;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">API ACTIVE</div>
    <h1>PayLap</h1>
    <p class="tagline">"Pay on proof, not on promise."</p>
    <p>PayLap Escrow & Milestone Settlement Layer for AI Agents is running.</p>
    <p>Check the documentation at <a href="/docs">/docs</a> or health status at <a href="/api/health">/api/health</a>.</p>
  </div>
</body>
</html>
