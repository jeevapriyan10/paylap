services:
  - type: web
    name: paylap-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PAYLAP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paylap-db
          property: connectionString
      - key: DATABASE_URL_MIGRATE
        fromDatabase:
          name: paylap-db
          property: connectionString
      - key: PAYLAP_SECRET_KEY
        generateValue: true
      - key: PAYLAP_MASTER_KEYS
        generateValue: true
      - key: PAYLAP_SIGNUP_MODE
        value: closed
      - key: PAYLAP_ALLOW_LIVE
        value: "false"
      - key: PAYLAP_RUNNER
        value: process
      - key: PAYLAP_JOBS_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

databases:
  - name: paylap-db
    plan: starter
    region: oregon
    databaseName: paylap
    user: paylap_owner
