[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paylap"
version = "0.3.0"
description = "Official Python SDK and MCP server for PayLap settlement engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PayLap Team" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
]

[project.scripts]
paylap-mcp = "paylap.mcp:main"
