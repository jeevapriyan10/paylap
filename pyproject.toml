[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paylap"
version = "1.0.0"
description = "Verified-delivery payment hold settlements API and engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "openapi-spec-validator>=0.7.0",
]

[project.scripts]
paylap = "app.cli:cli_app"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B904", "B905", "E501", "F841", "B007", "E741", "E712"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
